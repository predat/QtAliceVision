name: Build macOS

on:
  workflow_call:
    # Published in the nightly release notes, for the applications bundling the plugins
    outputs:
      qt_version:
        description: Qt version the plugins are built with
        value: ${{ jobs.prepare.outputs.qt_version }}
      av_url:
        description: AliceVision nightly archive the plugins are built against
        value: ${{ jobs.prepare.outputs.av_url }}

env:
  QT_VERSION: 6.12.0
  QT_ARCH: clang_64
  QT_MODULES: qtcharts qt3d qtshadertools

jobs:
  # Resolve the AliceVision nightly binaries to build against, their dependencies
  # and the runner used to build them, as we need the exact same deps to link against.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      av_url: ${{ steps.nightly.outputs.av_url }}
      deps_url: ${{ steps.nightly.outputs.deps_url }}
      qt_version: ${{ env.QT_VERSION }}
      runner: ${{ steps.nightly.outputs.runner }}
    steps:
      - name: Resolve AliceVision nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          ALICEVISION_REPO: ${{ vars.ALICEVISION_REPO || 'alicevision/AliceVision' }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view nightly --repo "${ALICEVISION_REPO}" --json assets)
          AV_URL=$(echo "${ASSETS}" | jq -r '.assets[] | select(.name | endswith("-macos.tar.gz")) | .url')
          DEPS_URL=$(echo "${ASSETS}" | jq -r '.assets[] | select(.name | endswith("-macos-deps.tar.gz")) | .url')
          # Asset name: AliceVision-nightly-<date>-<short sha>-macos.tar.gz
          AV_SHORT_SHA=$(basename "${AV_URL}" | sed -E 's/^AliceVision-nightly-[0-9]+-([0-9a-f]+)-macos\.tar\.gz$/\1/')
          AV_SHA=$(gh api "repos/${ALICEVISION_REPO}/commits/${AV_SHORT_SHA}" --jq '.sha')
          RUNNER=$(gh api "repos/${ALICEVISION_REPO}/contents/.github/workflows/build-macos.yml?ref=${AV_SHA}" \
                   -H "Accept: application/vnd.github.raw" \
                   | sed -nE 's/^\s*runs-on:\s*(\S+)\s*$/\1/p' | head -n1)
          echo "AliceVision nightly: ${AV_URL}"
          echo "Dependencies:        ${DEPS_URL}"
          echo "AliceVision commit:  ${AV_SHA}"
          echo "Runner:              ${RUNNER}"
          test -n "${AV_URL}" && test -n "${DEPS_URL}" && test -n "${AV_SHA}" && test -n "${RUNNER}"
          echo "av_url=${AV_URL}" >> $GITHUB_OUTPUT
          echo "deps_url=${DEPS_URL}" >> $GITHUB_OUTPUT
          echo "runner=${RUNNER}" >> $GITHUB_OUTPUT

  build-macos:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner }}
    env:
      BUILD_TYPE: Release
      # The CMake configs of AliceVision and of its dependencies refer to them with
      # the absolute paths of the AliceVision CI: extract them at the same location.
      DEPS_INSTALL_DIR: /Users/runner/work/AliceVision/AV_install
      QT_DIR: ${{ github.workspace }}/../Qt
      ALICEVISION_BUNDLE: ${{ github.workspace }}/../AV_bundle
      QTALICEVISION_ROOT: ${{ github.workspace }}/../QTAV_install
      LOG_DIR: ${{ github.workspace }}/../logs
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      # The Homebrew Python does not allow installing aqtinstall with pip
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      # Qt

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v6
        with:
          # QT_DIR without '..', which actions/cache rejects (the cache was never saved);
          # the runner context is not available in the job env
          path: ${{ runner.workspace }}/Qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-${{ env.QT_MODULES }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${LOG_DIR}"
          {
            python -m pip install aqtinstall
            python -m aqt install-qt --outputdir "${QT_DIR}" \
              mac desktop "${QT_VERSION}" "${QT_ARCH}" -m ${QT_MODULES}
          } 2>&1 | tee "${LOG_DIR}/install-qt.log"

      - name: Setup Qt environment
        run: |
          QT_ROOT=$(dirname $(dirname $(find "${QT_DIR}/${QT_VERSION}" -maxdepth 3 -path "*/bin/qmake" | head -n1)))
          echo "Qt root: ${QT_ROOT}"
          echo "QT_ROOT=${QT_ROOT}" >> $GITHUB_ENV
          echo "${QT_ROOT}/bin" >> $GITHUB_PATH

      # AliceVision

      - name: Fetch AliceVision nightly binaries and dependencies
        run: |
          mkdir -p "${LOG_DIR}" "${ALICEVISION_BUNDLE}" "$(dirname "${DEPS_INSTALL_DIR}")"
          {
            echo "Downloading: ${{ needs.prepare.outputs.av_url }}"
            curl -fsSL "${{ needs.prepare.outputs.av_url }}" | tar -xz -C "${ALICEVISION_BUNDLE}" --strip-components=1
            echo "Downloading: ${{ needs.prepare.outputs.deps_url }}"
            curl -fsSL "${{ needs.prepare.outputs.deps_url }}" | tar -xz -C "$(dirname "${DEPS_INSTALL_DIR}")"
            test -f "${ALICEVISION_BUNDLE}/include/aliceVision/config.hpp" || { echo "AliceVision headers missing from the nightly bundle"; exit 1; }
            test -d "${DEPS_INSTALL_DIR}/lib/cmake" || { echo "Unexpected dependencies archive layout:"; ls "$(dirname "${DEPS_INSTALL_DIR}")"; exit 1; }
          } 2>&1 | tee "${LOG_DIR}/fetch-alicevision.log"

      # qtAliceVision

      # AppleClang has no OpenMP: like the AliceVision build, use the libomp built
      # with the dependencies.
      - name: Configure CMake
        run: |
          mkdir -p "${LOG_DIR}"
          {
            cmake -B ./build -S . \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DBUILD_SHARED_LIBS:BOOL=ON \
              -DCMAKE_PREFIX_PATH:PATH="${QT_ROOT};${DEPS_INSTALL_DIR}" \
              -DCMAKE_INSTALL_PREFIX:PATH="${QTALICEVISION_ROOT}" \
              -DCMAKE_CXX_FLAGS="-I${DEPS_INSTALL_DIR}/include -Wl,-L${DEPS_INSTALL_DIR}/lib -Wl,-lomp" \
              -DAliceVision_DIR:PATH="${ALICEVISION_BUNDLE}/share/aliceVision/cmake"
          } 2>&1 | tee "${LOG_DIR}/configure-cmake.log"

      - name: Build
        run: |
          mkdir -p "${LOG_DIR}"
          {
            cmake --build ./build
          } 2>&1 | tee "${LOG_DIR}/build.log"

      - name: Install
        run: |
          mkdir -p "${LOG_DIR}"
          {
            cmake --install ./build
            for d in qtAliceVision depthMapEntity qmlSfmData qtAliceVisionImageIO curveViewer; do
              test -d "${QTALICEVISION_ROOT}/include/${d}" || { echo "Missing include/${d}"; exit 1; }
            done
            ls "${QTALICEVISION_ROOT}" "${QTALICEVISION_ROOT}/include"
          } 2>&1 | tee "${LOG_DIR}/install.log"

      # Expose the end of the failing log as annotations (visible without sign-in)
      - name: Report failure logs
        if: failure()
        run: |
          set +e
          LOG=$(ls -t "${LOG_DIR}"/*.log 2>/dev/null | head -n1) || true
          [ -n "${LOG}" ] || exit 0
          ERRS=$(grep -nE "error|Error|ERROR|No such file|not found|Could not|Undefined symbols" "${LOG}" | head -n 60)
          TAIL=$(tail -n 60 "${LOG}")
          esc() { tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          echo "::error title=$(basename ${LOG}) errors::$(echo "${ERRS}" | esc)"
          echo "::error title=$(basename ${LOG}) tail::$(echo "${TAIL}" | esc)"

      # Archive & Upload for nightly release

      # Only runs when called from nightly.yml
      - name: Create archive
        if: github.workflow == 'Nightly'
        id: archive
        run: |
          COMMIT_SHORT=$(git rev-parse --short=8 HEAD)
          DATE=$(date -u +%Y%m%d)
          ARCHIVE="qtAliceVision-nightly-${DATE}-${COMMIT_SHORT}-macos.tar.gz"
          tar -czf "${ARCHIVE}" -C "$(dirname ${QTALICEVISION_ROOT})" "$(basename ${QTALICEVISION_ROOT})"
          echo "filename=${ARCHIVE}" >> $GITHUB_OUTPUT

      - name: Upload archive artifact
        if: github.workflow == 'Nightly'
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: ${{ steps.archive.outputs.filename }}
          retention-days: 3
